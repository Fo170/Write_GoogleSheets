; Exemple Write_GoogleSheets — ESP8266 (ESP-12E / Wemos D1 Mini)
[env:esp12e]
platform = espressif8266
board = esp12e
framework = arduino
monitor_speed = 115200

lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
    paulstoffregen/OneWire @ ^2.3.8
    milesburton/DallasTemperature @ ^3.11.0
    ; La librairie elle-même (ce dépôt) : chemin relatif depuis examples/
    symlink://../..
